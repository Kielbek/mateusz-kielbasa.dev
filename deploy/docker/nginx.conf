# nginx wewnątrz kontenera. HTTPS, kompresję i HSTS robi wspólny Caddy w /srv/proxy.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # HTML zawsze świeży
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Zasoby statyczne z długim cache
    location ~* \.(css|js|png|jpe?g|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Ładne adresy: /poradnik/xyz -> xyz.html albo xyz/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
