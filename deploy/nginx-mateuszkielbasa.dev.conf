# Nginx: strona sprzedażowa pod mateuszkielbasa.dev
# Plik:  /etc/nginx/sites-available/mateuszkielbasa.dev
# Kod:   /var/www/mateuszkielbasa.dev  (index.html + pliki statyczne)
# SSL:   sudo certbot --nginx -d mateuszkielbasa.dev -d www.mateuszkielbasa.dev
#        (certbot sam dopisze bloki 443 i przekierowanie z http na https)

server {
    listen 80;
    listen [::]:80;
    server_name www.mateuszkielbasa.dev;
    return 301 https://mateuszkielbasa.dev$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mateuszkielbasa.dev;

    root /var/www/mateuszkielbasa.dev;
    index index.html;

    # Kompresja
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # Nagłówki bezpieczeństwa
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # HTML zawsze świeży, reszta z długim cache
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(css|js|png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Ładne adresy: /poradnik/xyz -> /poradnik/xyz.html lub /poradnik/xyz/index.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
